services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ferreteria_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
    depends_on:
      - postgres
      - redis
    networks:
      - ferreteria_network

  nginx:
    image: nginx:alpine
    container_name: ferreteria_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - ferreteria_network

  postgres:
    image: postgres:16-alpine
    container_name: ferreteria_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ferreteria_pos}
      POSTGRES_USER: ${DB_USERNAME:-ferreteria_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ferreteria_secret_pass}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - ferreteria_network

  redis:
    image: redis:7-alpine
    container_name: ferreteria_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    networks:
      - ferreteria_network

volumes:
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local

networks:
  ferreteria_network:
    driver: bridge
